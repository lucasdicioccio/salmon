synopsis:
    Idempotent operations as DAGs: the core graph and evaluation primitives.

description:
    Salmon expresses infrastructure, provisioning and CI/CD operations as DAGs of idempotent operations with uniform up/down/check semantics. This package holds the core algebraic-graph (OpGraph, Track, Eval) representation, with minimal dependencies.

